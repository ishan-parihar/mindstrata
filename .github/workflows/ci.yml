name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test + lint + bench gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # Lenient clippy: the workspace carries pre-existing pedantic/missing-docs
      # warnings; denying them all would fail the first CI run. This reports
      # warnings and fails only on hard errors.
      - name: Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets

      - name: Full workspace test suite (incl. §18.5 tick regression gate)
        run: cargo test --workspace

      - name: Benchmarks compile (§18.5 — criterion regression harness)
        run: cargo bench -p mindstrata-benches --no-run

      - name: Tick-loop regression gate (explicit run)
        run: cargo test -p mindstrata-tests tick_throughput_regression_gate

      # Iteration 160 (§18.5): release-mode throughput regression gate. The
      # debug gate above catches order-of-magnitude blowups; this one runs
      # the shipped configuration (release profile) at the full-capacity
      # 48-agent world and enforces a hard ticks/sec floor (calibrated on
      # a mid-range desktop: 1,040 ticks/sec; floor 600 = ~1.7x headroom
      # for slow shared runners).
      - name: Release-mode throughput regression gate (§18.5)
        run: cargo run -p mindstrata-benches --example regression_gate --release

      # Iteration 170 (§18.5, RWR row-67): per-subsystem regression gate.
      # The aggregate gates above can hide a slowdown confined to ONE
      # subsystem (a 10x memory-encode regression moves the 48-agent tick
      # by only ~2%). This isolates the hottest subsystem entry points
      # (memory-encode fresh + near-capacity, gossip single-hop) and
      # enforces hard ns/op ceilings in the shipped release profile — the
      # per-system regression thresholds the row-67 queue demanded.
      - name: Per-subsystem regression gate (§18.5)
        run: cargo run -p mindstrata-benches --example subsystem_gate --release
