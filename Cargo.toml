[workspace]
resolver = "2"
members = [
    "crates/mindstrata-core",
    "crates/mindstrata-person",
    "crates/mindstrata-sim",
    "crates/mindstrata-cli",
    "crates/mindstrata-tui",
    "crates/mindstrata-render",
    "crates/mindstrata-tests",
    "crates/mindstrata-benches",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ishanp/mindstrata"

[workspace.lints.rust]
# Forbid unsafe: the simulation must be memory-safe and deterministic.
# If a specific block ever needs unsafe, use #[allow(unsafe_code)] on that item.
unsafe_code = "forbid"
missing_docs = "warn"
dead_code = "warn"
unused_imports = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
must_use_candidate = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"
fn_params_excessive_bools = "allow"
if_not_else = "allow"
option_if_let_else = "allow"
items_after_statements = "allow"
default_trait_access = "allow"
bool_to_int_with_if = "allow"
match_same_arms = "allow"
redundant_field_names = "allow"
unreadable_literal = "allow"
manual_let_else = "allow"
format_push_string = "allow"
unnecessary_wraps = "allow"
float_cmp = "allow"
cast_possible_wrap = "allow"

[workspace.dependencies]
# Internal crates
mindstrata-core = { path = "crates/mindstrata-core" }
mindstrata-person = { path = "crates/mindstrata-person" }
mindstrata-sim = { path = "crates/mindstrata-sim" }

# Serialization
serde = { version = "1", features = ["derive"] }
ron = "0.8"
postcard = { version = "1", features = ["alloc"] }
serde_json = "1"

# Randomness (deterministic)
rand = "0.9"
rand_chacha = "0.9"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Graph structures
petgraph = "0.7"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Rendering (PNG maps)
image = { version = "0.25", default-features = false, features = ["png", "gif"] }

# Testing
insta = "1"
criterion = { version = "0.5", features = ["html_reports"] }
