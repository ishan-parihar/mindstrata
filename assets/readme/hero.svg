<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Mindstrata — emergent human-society simulation</title>
  <desc id="desc">A medieval settlement where every person carries a full mind: needs, emotions, beliefs, relationships, and institutional memberships. History emerges from ten substrate layers, from physics through biology, perception, emotion, psychology, social bonds, institutions, culture, noospheric fields, to the historical layer.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0F16"/>
      <stop offset="1" stop-color="#080A10"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#1C2434" stroke-width="2"/>

  <!-- ══════════ LEFT: IDENTITY ══════════ -->
  <g transform="translate(56 36)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" letter-spacing="4" fill="#E0A93C">EMERGENT SOCIETY SIMULATION</text>

    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="60" font-weight="800" fill="#ECF0F7" letter-spacing="-1.5">Mindstrata</text>

    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="23" font-weight="600" fill="#A8B2C4">A medieval settlement where every person</text>
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="23" font-weight="600" fill="#A8B2C4">carries a complete mind. History emerges</text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="23" font-weight="600" fill="#A8B2C4">from first principles — never scripted.</text>

    <text x="0" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#667088">Rust · 10 substrates · 1098 tests · deterministic replay</text>
    <text x="0" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#667088">unsafe forbidden · golden replay fixtures · TUI debug instrument</text>
  </g>

  <!-- ══════════ RIGHT: SUBSTRATE STRATA ══════════ -->
  <g transform="translate(648 30)">
    <text x="0" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" letter-spacing="2" fill="#667088">THE 10 SUBSTRATES</text>

    <!-- substrate bars (bottom = physics, top = history) -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="12">
      <rect x="0"   y="300" width="300" height="22" rx="4" fill="#16202E"/><text x="8" y="316" fill="#8FA0BD">10 · Historical / teleological</text>
      <rect x="0"   y="276" width="300" height="22" rx="4" fill="#1A2434"/><text x="8" y="292" fill="#8FA0BD">09 · Noospheric fields</text>
      <rect x="0"   y="252" width="300" height="22" rx="4" fill="#16202E"/><text x="8" y="268" fill="#8FA0BD">08 · Culture</text>
      <rect x="0"   y="228" width="300" height="22" rx="4" fill="#1A2434"/><text x="8" y="244" fill="#8FA0BD">07 · Institutions</text>
      <rect x="0"   y="204" width="300" height="22" rx="4" fill="#16202E"/><text x="8" y="220" fill="#8FA0BD">06 · Social relationships</text>
      <rect x="0"   y="180" width="300" height="22" rx="4" fill="#1A2434"/><text x="8" y="196" fill="#8FA0BD">05 · Psychology &amp; belief</text>
      <rect x="0"   y="156" width="300" height="22" rx="4" fill="#16202E"/><text x="8" y="172" fill="#8FA0BD">04 · Emotion &amp; cognition</text>
      <rect x="0"   y="132" width="300" height="22" rx="4" fill="#1A2434"/><text x="8" y="148" fill="#8FA0BD">03 · Perception</text>
      <rect x="0"   y="108" width="300" height="22" rx="4" fill="#16202E"/><text x="8" y="124" fill="#8FA0BD">02 · Biology</text>
      <rect x="0"   y="84"  width="300" height="22" rx="4" fill="#1A2434"/><text x="8" y="100" fill="#8FA0BD">01 · Physics / environment</text>
    </g>

    <!-- emergent agent path through strata -->
    <path d="M 320 90 C 368 90 368 140 330 140 C 296 140 296 190 336 190 C 372 190 372 240 330 240 C 298 240 298 292 330 292 C 352 292 352 310 330 310"
          fill="none" stroke="#E0A93C" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.9"/>
    <circle cx="330" cy="310" r="7" fill="#E0A93C"/>
    <text x="352" y="314" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#E0A93C">agents</text>

    <!-- emergence callout -->
    <g transform="translate(0 334)">
      <rect x="0" y="0" width="420" height="22" rx="4" fill="#1A2434" stroke="#E0A93C" stroke-opacity="0.35"/>
      <text x="12" y="16" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#C9B886">revolt · famine · factionalism — EMERGENT, not scripted</text>
    </g>
  </g>
</svg>
